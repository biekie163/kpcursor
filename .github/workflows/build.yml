name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方安装脚本：自动装 Theos + 工具链 + iOS SDK（CI 环境自动跳过所有提问）
      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      # 每个步骤是独立终端，需要把 THEOS 传给后面的步骤
      - name: Set THEOS env
        run: echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb
          path: cursor-tweak/packages/*.deb
