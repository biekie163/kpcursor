name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 【必须用 macOS runner】
    # Linux 上的 Theos 工具链链接不出「指针认证签名正确」的 arm64e 切片：
    # 产出的 LC_DYLD_CHAINED_FIXUPS / DYLD_CHAINED_PTR_ARM64E 在 iOS 16.1.2 上验签失败，
    # dyld 一映射 ObjC 元数据就 SIGBUS（Exception Subtype: UNKNOWN_0x105），
    # 表现为 SpringBoard 黑屏循环、或设置 App 一打开就闪退（1.0-5、1.0-6）。
    # Xcode 自带的 ld64 才能生成新 ABI 的 arm64e 二进制 —— 这是闭源工具，
    # 只有 macOS 上有。参见 theos.dev 的 arm64e deployment 说明。
    runs-on: macos-14
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -x
          uname -a
          sw_vers
          xcode-select -p
          xcodebuild -version || true
          clang --version || true
          make --version | head -n 1 || true

      - name: Install Theos
        run: |
          set -e
          # 逐个装，任何一个失败都不连累其它（dpkg-deb 用来打包，ldid 用来签名）
          brew install dpkg || true
          brew install ldid || true
          brew install xz || true
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Toolchain snapshot
        run: |
          set -x
          echo "THEOS=$THEOS"
          ls -la "$THEOS" || true
          ls -la "$THEOS/bin" || true
          command -v dpkg-deb || true
          command -v ldid || true
          command -v make || true
          echo "SYSROOT:"; xcrun --sdk iphoneos --show-sdk-path || true

      - name: Build package
        run: |
          set -o pipefail
          make clean || true
          if ! make package FINALPACKAGE=1 ARCHS="arm64 arm64e" > /tmp/build.log 2>&1; then
            echo "=== 完整日志的最后 25 行 ==="
            tail -n 25 /tmp/build.log
            echo "=== 出错相关行（同时写进 annotation，方便直接看）==="
            grep -n -i -E 'error|fatal|undefined|cannot|not found|No such|warning: .*deprecated' /tmp/build.log | head -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          tail -n 15 /tmp/build.log
          ls -l packages/

      - name: Verify slices (arm64e present)
        run: |
          set -o pipefail
          deb="$(ls packages/*.deb | head -n1)"
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          for f in \
            "$tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/KPCCursor.dylib" \
            "$tmp/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/KPCCursorPrefs"
          do
            echo "=== $f"
            file "$f"
            if ! python3 "$GITHUB_WORKSPACE/.github/scripts/check_macho.py" "$f"; then
              echo "::error::slice check failed for $f"
              exit 1
            fi
          done

      - name: Verify package layout
        run: |
          set -e
          deb="$(ls packages/*.deb | head -n1)"
          echo "Picked: $deb"
          dpkg-deb -c "$deb" | grep -E 'KPCCursor|KPCCursorPrefs|Tweak' || true
          dpkg-deb -I "$deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb-1.0-9
          path: cursor-tweak/packages/*.deb
          if-no-files-found: error
