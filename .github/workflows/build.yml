name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # 【必须用 macOS runner】
    # Linux 上的 Theos 工具链链接不出「指针认证签名正确」的 arm64e 切片：
    # 产出的 LC_DYLD_CHAINED_FIXUPS / DYLD_CHAINED_PTR_ARM64E 在 iOS 16.1.2 上验签失败，
    # dyld 一映射 ObjC 元数据就 SIGBUS（Exception Subtype: UNKNOWN_0x105），
    # 表现为 SpringBoard 黑屏循环、或设置 App 一打开就闪退（1.0-5、1.0-6）。
    # Xcode 自带的 ld64 才能生成新 ABI 的 arm64e 二进制 —— 这是闭源工具，
    # 只有 macOS 上有。参见 theos.dev 的 arm64e deployment 说明。
    runs-on: macos-14
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -e
          xcode-select -p
          clang --version
          sw_vers

      - name: Install Theos
        run: |
          set -e
          # dpkg-deb 用于打包与校验；ldid 给 dylib 签名；xz 给 Theos 解工具链
          brew install dpkg ldid xz || true
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          set -e
          # layout 目录必须是小写 layout（Theos 只认小写），资源交给 Theos 打包即可
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -l packages/

      - name: Verify slices (arm64e present)
        run: |
          set -e
          deb="$(ls packages/*.deb | head -n1)"
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          for f in \
            "$tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/KPCCursor.dylib" \
            "$tmp/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/KPCCursorPrefs"
          do
            echo "=== $f"
            file "$f"
            python3 "$GITHUB_WORKSPACE/.github/scripts/check_macho.py" "$f"
          done

      - name: Verify package layout
        run: |
          set -e
          deb="$(ls packages/*.deb | head -n1)"
          echo "Picked: $deb"
          dpkg-deb -c "$deb" | grep -E 'KPCCursor|KPCCursorPrefs|Tweak' || true
          dpkg-deb -I "$deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb-1.0-9
          path: cursor-tweak/packages/*.deb
          if-no-files-found: error
