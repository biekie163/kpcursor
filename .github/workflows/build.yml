name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Set THEOS env
        run: echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: make package FINALPACKAGE=1 ARCHS="arm64 arm64e"

      - name: 注入设置页文件并重打包（版本升为 1.0-3）
        run: |
          set -e
          DEB=$(ls packages/*.deb)
          rm -rf work && mkdir -p work
          dpkg-deb -R "$DEB" work
          mkdir -p work/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle
          mkdir -p work/var/jb/Library/PreferenceLoader/Preferences
          echo "" | base64 -d > work/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/Info.plist
          echo "" | base64 -d > work/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/Root.plist
          echo "" | base64 -d > work/var/jb/Library/PreferenceLoader/Preferences/KPCCursorPrefs.plist
          echo "" | base64 -d > work/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/icon.png
          echo "" | base64 -d > work/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/icon@2x.png
          echo "" | base64 -d > work/var/jb/Library/PreferenceBundles/KPCCursorPrefs.bundle/icon@3x.png
          sed -i 's/^Version: 1.0-0/Version: 1.0-3/' work/DEBIAN/control
          rm -f "$DEB"
          dpkg-deb -Z xz -b work "$DEB"
          echo "== 最终包文件清单 =="
          dpkg-deb -c "$DEB"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb-1.0-3
          path: cursor-tweak/packages/*.deb
