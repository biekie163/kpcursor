name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          set -e
          # 注意：layout 目录必须是小写 layout，Linux 文件系统区分大小写，
          # Theos 只认 layout/。资源文件交给 Theos 正常打包即可，不需要再手工塞一遍。
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          ls -l packages/

      - name: Verify package layout
        run: |
          set -e
          deb="$(ls packages/*.deb | head -n1)"
          echo "Picked: $deb"
          dpkg-deb -c "$deb" | grep -E 'KPCCursor|KPCCursorPrefs|Tweak' || true
          dpkg-deb -I "$deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb-1.0-6-test
          path: cursor-tweak/packages/*.deb
          if-no-files-found: error
