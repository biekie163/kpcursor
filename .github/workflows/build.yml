name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方安装脚本：自动装 Theos + 工具链 + iOS SDK（CI 环境自动跳过所有提问）
      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Set THEOS env
        run: echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # 生成设置页文件（内嵌 base64，构建时自动还原，不依赖仓库上传）
      - name: Ensure prefs bundle files
        run: |
          mkdir -p Layout/Library/PreferenceBundles/KPCCursorPrefs.bundle
          mkdir -p Layout/Library/PreferenceLoader/Preferences
          echo "" | base64 -d > Layout/Library/PreferenceBundles/KPCCursorPrefs.bundle/Info.plist
          echo "" | base64 -d > Layout/Library/PreferenceBundles/KPCCursorPrefs.bundle/Root.plist
          echo "" | base64 -d > Layout/Library/PreferenceLoader/Preferences/KPCCursorPrefs.plist
          echo "" | base64 -d > Layout/Library/PreferenceBundles/KPCCursorPrefs.bundle/icon.png
          echo "" | base64 -d > Layout/Library/PreferenceBundles/KPCCursorPrefs.bundle/icon@2x.png
          ls -R Layout

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb-full
          path: cursor-tweak/packages/*.deb
