name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cursor-tweak
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          # 注意：不要换回 ubuntu-latest。2026-11 起 latest 指向 ubuntu-26.04，
          # 该版本的 libxml2 改了包名（libxml2-16），Theos 自带安装脚本里
          # `apt install libxml2` 会直接报 "Package 'libxml2' has no installation candidate"
          # 导致整个 job 在装 Theos 这一步就失败（见 logs_112406007053.zip）。
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip git \
            libssl-dev libxml2 libncurses-dev pkg-config xz-utils \
            || sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip git \
            libssl-dev libxml2-16 libncurses-dev pkg-config xz-utils
          # 老的 Linux 工具链偶尔还要 libtinfo5，装不上就算了（不影响编译）
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          set -e
          # 注意：layout 目录必须是小写 layout，Linux 文件系统区分大小写，
          # Theos 只认 layout/。资源文件交给 Theos 正常打包即可，不需要再手工塞一遍。
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64"
          ls -l packages/

      - name: Verify dylib is arm64-only
        run: |
          set -e
          deb="$(ls packages/*.deb | head -n1)"
          tmp="$(mktemp -d)"
          dpkg-deb -x "$deb" "$tmp"
          dylib="$tmp/var/jb/Library/MobileSubstrate/DynamicLibraries/KPCCursor.dylib"
          file "$dylib"
          if file "$dylib" | grep -qi 'universal'; then
            echo "::error::dylib 是 fat 二进制，必须只有 arm64 一个切片"
            exit 1
          fi
          file "$dylib" | grep -qi 'arm64'

      - name: Verify package layout
        run: |
          set -e
          deb="$(ls packages/*.deb | head -n1)"
          echo "Picked: $deb"
          dpkg-deb -c "$deb" | grep -E 'KPCCursor|KPCCursorPrefs|Tweak' || true
          dpkg-deb -I "$deb"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KPCursor-deb-1.0-7-arm64
          path: cursor-tweak/packages/*.deb
          if-no-files-found: error
